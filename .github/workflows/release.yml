# GitHub Releases only. Cargo.toml sets publish = false, so this does not
# publish to crates.io.

name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: voltkit
    steps:
      - uses: actions/checkout@v4
        with:
          path: voltkit

      # Beside voltkit so the `../sibling` path dependencies resolve (see ci.yml for why all
      # three are needed even where they are not compiled).
      - name: check out the udskit path dependency
        uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/udskit
          path: udskit

      - name: check out the vcxtoolkit path dependency
        uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/vcxtoolkit
          path: vcxtoolkit

      - name: check out the fakeobd path dependency
        uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/fakeobd
          path: fakeobd

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: voltkit

      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: doc
        run: cargo doc --no-deps

  build:
    name: build (${{ matrix.asset }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: voltkit.exe
            asset: voltkit-x86_64-pc-windows-msvc.exe
            # Static CRT. The exe does not need the Visual C++ redistributable.
            rustflags: "-C target-feature=+crt-static"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: voltkit
            asset: voltkit-x86_64-unknown-linux-gnu
            rustflags: ""
    defaults:
      run:
        working-directory: voltkit
    steps:
      - uses: actions/checkout@v4
        with:
          path: voltkit

      # Beside voltkit so the `../sibling` path dependencies resolve (see ci.yml). The release
      # binary links only udskit on Linux and udskit + vcxtoolkit on Windows; fakeobd is present
      # for resolution but not compiled into a default build.
      - name: check out the udskit path dependency
        uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/udskit
          path: udskit

      - name: check out the vcxtoolkit path dependency
        uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/vcxtoolkit
          path: vcxtoolkit

      - name: check out the fakeobd path dependency
        uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/fakeobd
          path: fakeobd

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: voltkit

      - name: build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        # No --locked: voltkit path-depends on sibling repos (udskit, vcxtoolkit, fakeobd) that CI
        # checks out at their own moving `main`, so the committed Cargo.lock can't stay pinned to
        # them. Resolve fresh, matching how the ci.yml check jobs build.
        run: cargo build --release --target ${{ matrix.target }}

      - name: smoke
        shell: bash
        run: ./target/${{ matrix.target }}/release/${{ matrix.exe }} profile --list

      # dist lives at the workspace root ($GITHUB_WORKSPACE/dist) so upload-artifact, whose
      # path is workspace-relative, finds it even though these run steps default into voltkit/.
      - name: stage
        shell: bash
        run: |
          mkdir -p ../dist
          cp "target/${{ matrix.target }}/release/${{ matrix.exe }}" "../dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: sha256sum voltkit-* > SHA256SUMS

      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
          # The publish job checks out nothing (it only downloads artifacts), so give gh the repo
          # explicitly; otherwise `gh release` fails with "not a git repository".
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
