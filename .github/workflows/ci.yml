name: ci

on:
  # There is no main branch. A push to the default branch, and to a working branch, is the run.
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows-only: voltkit is a Windows tool (VCX-NANO + native BLE). There is no
        # Linux platform for it, so the Linux leg is dropped.
        os: [windows-latest]
    defaults:
      run:
        working-directory: voltkit
    steps:
      - uses: actions/checkout@v4
        with:
          path: voltkit

      # voltkit has path dependencies on sibling crates, the same `../sibling` layout the D:\code
      # workspace uses locally. Cargo resolves every declared path dependency's manifest even when
      # the owning feature is off and even on a platform that will not compile it, so all four
      # siblings are checked out beside voltkit on both OSes. What stays lean is the *compiled*
      # graph: the Linux default build links only udskit (vcxtoolkit and dangle are `cfg(windows)`,
      # fakeobd is behind the off-by-default `lab` feature); the Windows default build also links
      # vcxtoolkit and dangle (the native BLE radio library). All repos are public, so the default
      # token is enough.
      - name: check out the udskit path dependency
        uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/udskit
          path: udskit

      - name: check out the vcxtoolkit path dependency (VCX-NANO, Windows-gated)
        uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/vcxtoolkit
          path: vcxtoolkit

      - name: check out the dangle path dependency (native BLE radio, Windows-gated)
        uses: actions/checkout@v4
        with:
          repository: b1tninja/dangle
          path: dangle

      - name: check out the fakeobd path dependency (lab feature, off by default)
        uses: actions/checkout@v4
        with:
          repository: b1tninja-labs/fakeobd
          path: fakeobd

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: voltkit

      - name: fmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test
        run: cargo test

      - name: doc
        run: cargo doc --no-deps

      # Exercise the optional lab feature (links the fakeobd library), so the in-process
      # bench stays building. The default jobs above do not compile fakeobd.
      - name: lab feature
        run: cargo clippy --features lab --all-targets -- -D warnings
