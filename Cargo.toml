[package]
name = "voltkit"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "ELM327-over-TCP read client for the Voltage Wi-Fi session"

[target.'cfg(windows)'.dependencies]
# Opens the COM port the operator names for `voltkit profile`. The crate forbids unsafe.
serialport = "4.7"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
# The wizard's full-screen terminal. ratatui 0.30 asks the app to depend on crossterm itself.
crossterm = "0.29"
ratatui = { version = "0.30.2", features = ["crossterm"] }
# The shared UDS (ISO 14229-1) / GMLAN model. voltkit reads one catalog for the service-id
# framing, the +0x40 positive-response offset, the ReadDataByIdentifier codec, and the GMLAN
# +0x400 addressing, instead of hand-rolling them beside gmdiag. Path dependency on the sibling
# repo; no bus, no key material, no write service crosses this boundary.
udskit = { path = "../udskit" }
